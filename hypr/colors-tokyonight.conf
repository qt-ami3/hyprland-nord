# Tokyo Night Color Scheme for Hyprland
# Blue: #7aa2f7 (122, 162, 247)
# Purple: #bb9af7 (187, 154, 247)
# Dark Blue: #3d59a1 (61, 89, 161)

general {
    col.active_border = rgba(122,162,247,1) rgba(187,154,247,1) 45deg
    col.inactive_border = rgba(61,89,161,1)
}

decoration {
    blur {
        size = 9
    }
}
